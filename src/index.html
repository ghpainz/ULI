<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>ULI</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' uli: data: blob:; script-src 'self' uli:; style-src 'self' 'unsafe-inline' uli:; img-src 'self' uli: data: blob:; media-src uli: blob:; font-src 'self' uli: data:">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="menubar"></div>

  <div id="workspace">
    <div id="row-top" class="row">
      <div class="panel-group" id="group-left-top" data-group="leftTop"></div>
      <div class="splitter v" data-split="topLeft"></div>
      <div class="panel-group" id="group-right-top" data-group="rightTop"></div>
    </div>
    <div class="splitter h" data-split="rows"></div>
    <div id="row-bottom" class="row">
      <div class="panel-group" id="group-left-bottom" data-group="leftBottom"></div>
      <div class="splitter v" data-split="bottomLeft"></div>
      <div id="tools-strip"></div>
      <div class="panel-group" id="group-timeline" data-group="timeline"></div>
      <div id="meters-strip"><canvas id="master-meter"></canvas><div class="meter-scale"></div></div>
    </div>
  </div>

  <div id="statusbar"><span id="status-text"></span><span id="status-jobs"></span></div>
  <div id="overlay-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
